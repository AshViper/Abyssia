<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-ai 生成</title>
<style>
:root {
	--bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #69707d; --line: #e2e5ea;
	--accent: #2f6fdd; --accent-soft: #dce7fb; --good: #1f8a4c; --good-soft: #dcf3e5;
	--warn: #b7791f; --warn-soft: #fbefd6; --bad: #c0392b; --bad-soft: #f9e0dd;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #8d95a3; --line: #2a303b;
		--accent: #6d9ff5; --accent-soft: #1f2d49; --good: #4cc27f; --good-soft: #173526;
		--warn: #e0a64a; --warn-soft: #3a2e17; --bad: #ef6b5e; --bad-soft: #3d1f1c;
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
nav a { color: var(--muted); text-decoration: none; margin-right: 12px; font-size: 13px; }
nav a.on { color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
textarea { flex: 1; min-width: 240px; min-height: 64px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-weight: 400; }
.status { margin-top: 10px; font-size: 13px; color: var(--muted); }
.status b { color: var(--text); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.steps span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.steps span.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.steps span.done { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.res { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.res .q { font-weight: 600; margin-bottom: 4px; }
.res .meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.res img { width: 100%; image-rendering: pixelated; background: var(--bg); border-radius: 6px; display: block; }
.res .noimg { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 24px 8px; text-align: center; font-size: 12px; }
.res a { font-size: 12px; margin-right: 10px; color: var(--accent); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-left: 6px; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
.sub { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
	<header>
		<h1>生成（学習と並行）</h1>
		<nav><a href="/">進捗</a><a href="/model">モデルの中身</a><a href="/generate" class="on">生成</a></nav>
	</header>

	<section class="card">
		<h2>文章からモデルを作る　<span class="sub">GPU は学習中なので CPU（llama.cpp）で動かします。学習の最新チェックポイントを自動で使います</span></h2>
		<div class="row">
			<textarea id="prompt" placeholder="例: 青く光る触手を持つ半透明のクラゲ"></textarea>
			<button id="go">生成</button>
		</div>
		<div class="chips" id="chips"></div>
		<div class="steps" id="steps"><span data-s="server">① チェックポイント確認・準備</span><span data-s="infer">② CPU で推論</span><span data-s="validate">③ 生成器で検証</span><span data-s="export">④ .bbmodel を書き出し</span></div>
		<div class="status" id="status">状態を取得中…</div>
		<div class="err" id="err"></div>
	</section>

	<section class="card">
		<h2>生成したモデル　<span class="sub">画像は 正面 / 横 / 斜め。ファイルは tools/model-ai/runtime/generated/ にも保存されます</span></h2>
		<div class="list" id="list"></div>
	</section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const EXAMPLES = ['青く光る触手を持つ半透明のクラゲ', '尾に向かって赤くなる大きな深海魚。白い腹', 'a black eel with a glowing cyan ridge along its back', '大きなはさみを持つ白いカニ', 'a small orange mushroom with glowing spots', 'a horned four-legged beast with a long tail'];
$('chips').innerHTML = EXAMPLES.map((e) => `<button class="chip" type="button">${esc(e)}</button>`).join('');
$('chips').addEventListener('click', (e) => { if (e.target.classList.contains('chip')) $('prompt').value = e.target.textContent; });

const ORDER = ['server', 'infer', 'validate', 'export'];
function adapterText(a) {
	if (!a) return '–';
	if (a.kind === 'base') return '未学習のベースモデル（最初のチェックポイントは 500 ステップ目）';
	if (a.kind === 'final') return `${a.run} の学習完了版`;
	return `${a.run} のステップ ${a.step} のチェックポイント`;
}
let busy = false;
async function status() {
	try {
		const s = await (await fetch('/api/gen/status')).json();
		const idx = ORDER.indexOf(s.stage);
		document.querySelectorAll('#steps span').forEach((el, i) => {
			el.classList.toggle('on', s.busy && i === idx);
			el.classList.toggle('done', s.busy && idx > i);
		});
		const using = s.adapter ? adapterText(s.adapter) : 'まだ起動していません（最初の生成で起動）';
		const newer = s.latest && s.adapter && (s.latest.step !== s.adapter.step || s.latest.kind !== s.adapter.kind) ? `　新しい保存あり: ${adapterText(s.latest)}（次の生成で切り替え）` : '';
		$('status').innerHTML = `使用中: <b>${esc(using)}</b>${esc(newer)}　／　サーバー: ${esc({ ready: '待機中', starting: '起動中…', stopped: '停止', error: 'エラー' }[s.status] || s.status)}${s.converting ? '　／　LoRA を GGUF に変換中…' : ''}　／　CPU ${s.threads} スレッド${s.error ? `　／　<span style="color:var(--bad)">${esc(s.error)}</span>` : ''}`;
		renderList(s.history || []);
	} catch {
		$('status').textContent = 'ダッシュボードに接続できません';
	}
}
let listKey = '';
function renderList(items) {
	const key = items.map((r) => r.id).join(',');
	if (key === listKey) return;
	listKey = key;
	$('list').innerHTML = items.length ? items.map((r) => {
		const img = `/api/gen/file?id=${encodeURIComponent(r.id)}&name=preview.png`;
		const files = (r.files || []).map((f) => `<a href="/api/gen/file?id=${encodeURIComponent(r.id)}&name=${encodeURIComponent(f)}&download=1">${esc(f)}</a>`).join('');
		const tries = (r.attempts || []).length;
		const problems = (r.attempts || []).flatMap((a) => a.problems || []).slice(0, 2).join(' / ');
		return `<div class="res"><div class="q">「${esc(r.prompt)}」<span class="pill ${r.ok ? 'good' : 'bad'}">${r.ok ? '成功' : '失敗'}</span></div>
			<div class="meta">${esc(adapterText(r.adapter))}・${r.seconds} 秒・試行 ${tries} 回${r.cubes ? `・${r.cubes} キューブ` : ''}</div>
			${r.cubes ? `<img src="${img}" alt="preview">` : `<div class="noimg">モデルにできませんでした${problems ? `<br>${esc(problems)}` : ''}</div>`}
			<div style="margin-top:6px">${files}<a href="/api/gen/file?id=${encodeURIComponent(r.id)}&name=spec.json">spec.json</a></div></div>`;
	}).join('') : '<div class="sub">まだありません</div>';
}
$('go').addEventListener('click', async () => {
	const prompt = $('prompt').value.trim();
	if (!prompt || busy) return;
	busy = true;
	$('go').disabled = true;
	$('err').textContent = '';
	try {
		const r = await fetch('/api/gen', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt }) });
		const j = await r.json();
		if (j.error) $('err').textContent = j.error;
	} catch (err) {
		$('err').textContent = err.message;
	} finally {
		busy = false;
		$('go').disabled = false;
		listKey = '';
		status();
	}
});
status();
setInterval(status, 1500);
</script>
</body>
</html>
